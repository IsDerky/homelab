# Lo mismo que el CI, antes de cada commit. Una vez por clon:
#   pipx install pre-commit && pre-commit install
# Las versiones las sube Renovate.
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Como en el CI: desde ansible/ y con las colecciones del requirements.yml
  # (ansible-lint las instala solo en .ansible/)
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        entry: bash -c 'cd ansible && python3 -m ansiblelint playbooks roles'
        files: ^ansible/
        pass_filenames: false
        # El hook pide la última versión de Python; vale cualquier 3 reciente
        language_version: python3
