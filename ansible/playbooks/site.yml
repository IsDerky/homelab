---
# El servidor entero, en orden. En una máquina nueva, antes de nginx hay que
# restaurar /etc/letsencrypt del backup.
- name: Base
  ansible.builtin.import_playbook: base.yml
- name: SSH
  ansible.builtin.import_playbook: ssh.yml
- name: Endurecimiento
  ansible.builtin.import_playbook: endurecimiento.yml
- name: Actualizaciones automáticas
  ansible.builtin.import_playbook: actualizaciones.yml
- name: Cortafuegos
  ansible.builtin.import_playbook: firewall.yml
- name: CrowdSec
  ansible.builtin.import_playbook: crowdsec.yml
- name: Avisos
  ansible.builtin.import_playbook: avisos.yml
- name: Disco USB
  ansible.builtin.import_playbook: storage.yml
- name: Backups
  ansible.builtin.import_playbook: backup.yml
- name: NAS
  ansible.builtin.import_playbook: nas.yml
- name: Servidor web
  ansible.builtin.import_playbook: nginx.yml
- name: Túnel
  ansible.builtin.import_playbook: cloudflared.yml
- name: Aplicaciones
  ansible.builtin.import_playbook: apps.yml
- name: Vaultwarden
  ansible.builtin.import_playbook: vaultwarden.yml
- name: Webs
  ansible.builtin.import_playbook: webs.yml
- name: CI/CD
  ansible.builtin.import_playbook: ci.yml
- name: Pterodactyl
  ansible.builtin.import_playbook: pterodactyl.yml
# nodos: necesita a todas las máquinas en la misma pasada (la deriva lo salta)
- name: Túnel con los nodos
  ansible.builtin.import_playbook: wireguard.yml
  tags: [nodos]
- name: Monitorización
  ansible.builtin.import_playbook: monitoring.yml
- name: Honeypot
  ansible.builtin.import_playbook: honeypot.yml
