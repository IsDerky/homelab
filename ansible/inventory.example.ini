# Copiar a inventory.ini (no va a git) y ajustar.
[homelab]
servidor ansible_host=192.168.1.10 ansible_user=root

[homelab:vars]
base_admin_user=admin
base_admin_keys=["ssh-ed25519 AAAA... admin@portatil"]

[honeypot]
servidor ansible_host=192.168.1.10 ansible_user=admin

[honeypot:vars]
# Router, SSH y servicios del servidor, otro equipo de la LAN y la pasarela
# de la red del honeypot (el propio servidor visto desde el contenedor)
honeypot_test_targets=["192.168.1.1:80", "192.168.1.10:22", "192.168.1.10:3306", "192.168.1.20:445", "172.30.250.1:22"]
