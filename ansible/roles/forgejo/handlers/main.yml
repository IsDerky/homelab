---
- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Aplicar compose de forgejo
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ forgejo_dir }}"
  changed_when: true
  # En --check la carpeta nueva no existe y command no hace nada de todas formas
  when: not ansible_check_mode
