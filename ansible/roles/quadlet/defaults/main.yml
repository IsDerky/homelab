---
# Servicios en contenedores rootless de Podman, cada uno con su usuario del
# sistema y una unidad quadlet de usuario (~/.config/containers/systemd). La
# imagen no la trae el rol: la construye el despliegue de cada app y la etiqueta
# como `imagen`; sin ella, el rol deja todo listo y no arranca nada.
#
# quadlet_servicios:
#   - nombre: mi-bot                    # unidad mi-bot.service del usuario
#     usuario: mibot                    # se crea si no existe (sistema, sin shell)
#     descripcion: Bot de ejemplo
#     imagen: localhost/mi-bot:actual
#     orden: bun src/index.ts           # opcional: sustituye al CMD de la imagen
#     memoria: 512M                     # MemoryMax de la unidad
#     red: host                         # opcional: host = loopback compartido
#     volumenes:                        # host:contenedor[:opciones]; el host se crea del usuario
#       - /var/lib/mi-bot:/var/lib/mi-bot
#     entorno:                          # variables en claro (nada secreto)
#       NODE_ENV: production
#     fichero_entorno: /etc/mi-bot.env  # opcional: se copia al home del usuario (0600)
#     solo_lectura: true                # raíz del contenedor de solo lectura (por defecto)
#     arrancar: true                    # false = preparado y parado
#     repo: mi-bot                      # opcional: nombre en deploy-repo; con él se
#                                       # reconstruye cada semana (quadlet-reconstruir)
quadlet_servicios: []

# Home de los usuarios de servicio (imágenes, quadlets y entorno van ahí)
quadlet_home_base: /var/lib/quadlet

# Rango de subuid/subgid: cada usuario recibe 65536 ids a partir de
# quadlet_subid_base + índice * 65536. Lejos de los de las cuentas normales
# (100000...) para no pisarse.
quadlet_subid_base: 1000000000

# Segundos que se espera a que una unidad recién arrancada siga activa
quadlet_espera_arranque: 10

# Dónde guarda podman sus eventos (create, start, died...) para estos usuarios.
# file = $XDG_RUNTIME_DIR/libpod/tmp/events (se ven con podman events) y no
# ensucian el journal de la unidad; journald es lo que podman usa por defecto.
quadlet_eventos: file

# Reconstrucción semanal: los servicios con `repo` se vuelven a construir en el
# commit con el que corren, sin caché y bajando la imagen base, para que los
# parches de la base no esperen a un commit (los pasos de la app leen
# DEPLOY_RECONSTRUIR). Lunes de madrugada, antes de Renovate (antes de las 7).
quadlet_reconstruir_cuando: "Mon *-*-* 05:30:00"

# Colector textfile de node-exporter: quadlet.prom con la edad de cada imagen en
# marcha (alerta ImagenContenedorVieja del rol monitoring a los 14 días)
quadlet_textfile_dir: /var/lib/node-exporter/textfile
