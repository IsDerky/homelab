---
# node-exporter suelto, para máquinas sin el rol monitoring (los nodos de fuera)
node_exporter_dir: /opt/node-exporter
node_exporter_image: prom/node-exporter:v1.12.1
node_exporter_mem: 64m

# IP:puerto donde escucha. Obligatoria: en los nodos, la IP del túnel, para que
# solo se pueda leer desde dentro.
node_exporter_listen: ""

# .prom que escriben scripts del host (nodo-export deja ahí nodo.prom)
node_exporter_textfile_dir: /var/lib/node-exporter/textfile

# Unidad systemd sin la que no tiene sentido arrancar (la del túnel)
node_exporter_after: ""
