---
- name: Falta dónde escucha
  ansible.builtin.assert:
    that: node_exporter_listen | length > 0
    fail_msg: Define node_exporter_listen (IP:puerto).
    quiet: true

- name: Carpetas
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ node_exporter_dir }}"
    - "{{ node_exporter_textfile_dir }}"

- name: Compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ node_exporter_dir }}/compose.yaml"
    mode: "0644"
  notify: Aplicar compose de node-exporter

- name: Unidad systemd
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
    mode: "0644"
  register: node_exporter_unit
  notify: Recargar systemd

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Servicio
  ansible.builtin.systemd_service:
    name: node-exporter.service
    enabled: true
    state: started
  when: not (ansible_check_mode and node_exporter_unit.changed)

- name: Responde
  ansible.builtin.uri:
    url: http://{{ node_exporter_listen }}/metrics
    return_content: false
  register: node_exporter_check
  until: node_exporter_check.status == 200
  retries: 12
  delay: 5
  changed_when: false
  when: not ansible_check_mode
