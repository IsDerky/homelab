---
- name: Paquete
  ansible.builtin.apt:
    name: earlyoom
    state: present
  register: earlyoom_paquete

# La unidad pasa $EARLYOOM_ARGS partido por espacios y sin quitar comillas:
# las expresiones van sin comillas ni espacios (ni $, por si se expande)
- name: Opciones
  ansible.builtin.copy:
    content: |
      # Gestionado por Ansible (rol earlyoom)
      EARLYOOM_ARGS="{{ earlyoom_args | join(' ') }}"
    dest: /etc/default/earlyoom
    owner: root
    group: root
    mode: "0644"
  vars:
    earlyoom_args: >-
      {{ ['-m', earlyoom_memoria, '-s', earlyoom_swap, '-r', earlyoom_informe,
          '--avoid', '^(' ~ earlyoom_evitar | join('|') ~ ')']
         + (['--prefer', '^(' ~ earlyoom_preferir | join('|') ~ ')'] if earlyoom_preferir else []) }}
  notify: Reiniciar earlyoom

- name: En marcha
  ansible.builtin.systemd_service:
    name: earlyoom
    enabled: true
    state: started
  when: not (ansible_check_mode and earlyoom_paquete.changed)

- name: Servicios instalados
  ansible.builtin.service_facts:
  when: earlyoom_sin_oomd

# En 22.04 no hay socket; service_facts no lista sockets
- name: Socket de systemd-oomd
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/systemd-oomd.socket
  register: earlyoom_oomd_socket
  when: earlyoom_sin_oomd

- name: Sin systemd-oomd
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ (['systemd-oomd.socket'] if earlyoom_oomd_socket.stat.exists else []) + ['systemd-oomd.service'] }}"
  when:
    - earlyoom_sin_oomd
    - "'systemd-oomd.service' in ansible_facts.services"

- name: Contador de muertes
  when: earlyoom_textfile_dir | length > 0
  block:
    - name: Script earlyoom-contador
      ansible.builtin.copy:
        src: earlyoom-contador
        dest: /usr/local/sbin/earlyoom-contador
        owner: root
        group: root
        mode: "0755"

    - name: Unidades earlyoom-contador
      ansible.builtin.template:
        src: earlyoom-contador.{{ item }}.j2
        dest: /etc/systemd/system/earlyoom-contador.{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: earlyoom_contador_unidades

    - name: Timer earlyoom-contador
      ansible.builtin.systemd_service:
        name: earlyoom-contador.timer
        enabled: true
        state: started
        daemon_reload: "{{ earlyoom_contador_unidades.changed }}"
      when: not (ansible_check_mode and earlyoom_contador_unidades.changed)
