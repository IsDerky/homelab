---
- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# up -d solo recrea el contenedor si el compose ha cambiado; el token se lee al
# arrancar, así que con un token nuevo hay que forzarlo
- name: Aplicar compose de vaultwarden
  ansible.builtin.command: docker compose up -d --force-recreate --remove-orphans
  args:
    chdir: "{{ vaultwarden_dir }}"
  changed_when: true
