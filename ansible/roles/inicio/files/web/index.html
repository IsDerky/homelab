<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Inicio</title>
<link rel="icon" href="icons/inicio.svg">
<link rel="stylesheet" href="inicio.css">
<script src="inicio.js" defer></script>
</head>
<body>
<canvas class="fondo" id="fondo" aria-hidden="true"></canvas>
<div class="velo-fondo" aria-hidden="true"></div>

<main class="pagina">
  <header class="cabecera">
    <div>
      <div class="hora" id="hora">--:--</div>
      <div class="fecha" id="fecha"></div>
    </div>
    <div class="resumen" id="resumen" role="status"></div>
  </header>
  <div class="rejilla" id="rejilla"></div>
  <p class="aviso" id="aviso" hidden></p>
</main>

<div class="carpeta-abierta" id="carpeta" role="dialog" aria-modal="true" aria-labelledby="carpeta-titulo" hidden>
  <div class="panel" id="carpeta-panel">
    <h2 id="carpeta-titulo"></h2>
    <div class="dentro" id="carpeta-dentro"></div>
  </div>
</div>
</body>
</html>
