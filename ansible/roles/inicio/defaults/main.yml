---
# Página de inicio propia: iconos cuadrados con el nombre
# debajo, carpetas que se abren encima y widgets con cifras de Prometheus.
# La página es estática; los datos los escribe inicio-datos cada 30 s en
# /run/inicio/datos.json con las consultas de aquí (el navegador nunca habla
# con Prometheus).
inicio_dir: /var/www/inicio
inicio_prometheus: http://127.0.0.1:9090
inicio_titulo: Inicio
inicio_intervalo: 30
# Carpeta del controlador con iconos propios (logos de las webs); salen como icons/apps/<fichero>
inicio_iconos_dir: ""

# Lo que sale en la página, en orden. Tres tipos:
#
#   - widget: servidor          # id
#     titulo: Servidor
#     icono: inicio.svg         # fichero de icons/ o uno de serie: sai, nube, escudo
#     tamano: 6x2               # 6x2 o 4x2 (4 cifras), 3x2 o 2x2 (2 cifras)
#     estado:                   # opcional: texto junto al título según el valor
#       consulta: sai_conectado * (1 + sai_en_bateria)
#       textos: {"0": sin conexión, "1": con corriente, "2": con batería}
#       bien: [1]               # opcional: valores con punto verde junto al título; el resto, rojo
#     punto: cifras             # opcional (sin estado.bien): verde si ninguna cifra está en rojo ni a medias (valor/de)
#     cifras:                   # hasta 4 (2 en los de 2x2)
#       - etiqueta: CPU
#         consulta: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
#         unidad: "%"
#         decimales: 0
#         de: count(algo)       # opcional: sale «valor/de»
#         formato: duracion     # opcional: la consulta da segundos → «14 min», «3 h»
#         rojo: {mayor: 90}     # opcional: en rojo si pasa de (mayor) o baja de (menor)
#
#   - widget: caducidades       # lista en vez de cifras; se pulsa para verlo todo
#     titulo: Caducidades
#     icono: calendario
#     tamano: 6x3
#     caducidades:
#       consulta: caducidad_timestamp_segundos   # una serie por cosa (etiquetas nombre, corto, dominio, renovar)
#       filas: 4                # cuántas se ven en el recuadro
#       aviso: 30               # días: punto rojo si algo (sin contar los grupos) baja de aquí
#       grupos:                 # muchas cosas iguales en una fila
#         - consulta: probe_ssl_earliest_cert_expiry{job="tls"}
#           nombre: certificados TLS
#           nota: se renuevan solos
#           renovar: certbot los renueva a 30 días
#
#   - app: oficina
#     nombre: Oficina
#     icono: oficina.svg        # de icons/ o apps/<fichero> (inicio_iconos_dir)
#     forma: pixel              # glifo (por defecto, centrado), lleno (tapa la placa) o pixel
#     url: https://oficina.example.com/      # se abre en otra pestaña; sin url no es enlace (p. ej. el NAS)
#     sonda: https://oficina.example.com/    # instance de probe_success para el punto verde/rojo
#
#   - carpeta: juegos
#     nombre: Juegos
#     apps: [ ...apps como arriba... ]
inicio_elementos: []
