---
- name: Carpetas
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ homeassistant_dir }}", mode: "0755" }
    # Tokens de las integraciones y claves locales de los aparatos
    - { path: "{{ homeassistant_config_dir }}", mode: "0700" }
    - { path: "{{ homeassistant_config_dir }}/packages", mode: "0755" }
    - { path: "{{ homeassistant_config_dir }}/themes", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

# La interfaz los reescribe: solo se crean vacíos la primera vez
- name: Ficheros de la interfaz
  ansible.builtin.copy:
    content: "{{ item.contenido }}"
    dest: "{{ homeassistant_config_dir }}/{{ item.nombre }}"
    force: false
    mode: "0644"
  loop:
    - { nombre: automations.yaml, contenido: "[]\n" }
    - { nombre: scripts.yaml, contenido: "{}\n" }
    - { nombre: scenes.yaml, contenido: "[]\n" }
  loop_control:
    label: "{{ item.nombre }}"

- name: Configuración (configuration.yaml)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ homeassistant_config_dir }}/configuration.yaml"
    mode: "0644"
  notify: Reiniciar homeassistant

- name: Paquetes de configuración
  ansible.builtin.copy:
    # ansible_managed solo existe en las plantillas
    content: "# Lo escribe Ansible (homeassistant_packages): los cambios aquí se pierden\n{{ item.value }}\n"
    dest: "{{ homeassistant_config_dir }}/packages/{{ item.key }}.yaml"
    mode: "0644"
  loop: "{{ homeassistant_packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reiniciar homeassistant

- name: Integraciones de la comunidad
  when: homeassistant_custom_components | length > 0
  block:
    - name: Carpetas de integraciones y descargas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ homeassistant_config_dir }}/custom_components"
        - "{{ homeassistant_cache_dir }}"

    - name: ¿Existe la carpeta de descargas?
      ansible.builtin.stat:
        path: "{{ homeassistant_cache_dir }}"
      register: homeassistant_cache_stat

    - name: Descargar (con la suma fijada)
      # En seco, la primera vez la carpeta aún no existe y get_url falla
      when: not ansible_check_mode or homeassistant_cache_stat.stat.exists
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ homeassistant_cache_dir }}/{{ item.nombre }}-{{ item.version }}.tar.gz"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0644"
      loop: "{{ homeassistant_custom_components }}"
      loop_control:
        label: "{{ item.nombre }} {{ item.version }}"

    - name: Versión instalada
      ansible.builtin.command: cat {{ homeassistant_config_dir }}/custom_components/{{ item.nombre }}/.version-ansible
      loop: "{{ homeassistant_custom_components }}"
      loop_control:
        label: "{{ item.nombre }}"
      register: homeassistant_cc_version
      changed_when: false
      failed_when: false
      check_mode: false

    # Otra versión (o instalada a mano): se quita entera para no dejar ficheros viejos
    - name: Quitar la versión anterior
      ansible.builtin.file:
        path: "{{ homeassistant_config_dir }}/custom_components/{{ item.item.nombre }}"
        state: absent
      loop: "{{ homeassistant_cc_version.results }}"
      loop_control:
        label: "{{ item.item.nombre }}"
      when: item.stdout != item.item.version

    # tar y no unarchive: hace falta el comodín para sacar solo custom_components/<nombre>
    # sin saber el nombre de la carpeta raíz del tarball (cambia con el repo y la versión)
    - name: Extraer custom_components/<nombre>  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        tar -xzf {{ homeassistant_cache_dir }}/{{ item.item.nombre }}-{{ item.item.version }}.tar.gz
        -C {{ homeassistant_config_dir }}/custom_components --strip-components=2
        --wildcards '*/custom_components/{{ item.item.nombre }}'
      args:
        creates: "{{ homeassistant_config_dir }}/custom_components/{{ item.item.nombre }}/manifest.json"
      loop: "{{ homeassistant_cc_version.results }}"
      loop_control:
        label: "{{ item.item.nombre }}"
      when: item.stdout != item.item.version
      notify: Reiniciar homeassistant

    - name: Marcar la versión
      ansible.builtin.copy:
        content: "{{ item.version }}"
        dest: "{{ homeassistant_config_dir }}/custom_components/{{ item.nombre }}/.version-ansible"
        mode: "0644"
      loop: "{{ homeassistant_custom_components }}"
      loop_control:
        label: "{{ item.nombre }}"
      # En seco, la primera vez la carpeta aún no existe
      when: not ansible_check_mode

- name: Clave SSH
  when: homeassistant_ssh_clave | bool
  block:
    - name: Carpeta de la clave
      ansible.builtin.file:
        path: "{{ homeassistant_config_dir }}/ssh"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Solo la primera vez: después se conserva (está en la copia)
    - name: Generar la clave
      ansible.builtin.command: >-
        ssh-keygen -q -t ed25519 -N "" -C "home-assistant@{{ inventory_hostname }}"
        -f {{ homeassistant_config_dir }}/ssh/id_ed25519
      args:
        creates: "{{ homeassistant_config_dir }}/ssh/id_ed25519"

    - name: ¿Existe la clave?
      ansible.builtin.stat:
        path: "{{ homeassistant_config_dir }}/ssh/id_ed25519.pub"
      register: homeassistant_ssh_pub

    - name: Carpeta de la pública
      ansible.builtin.file:
        path: "{{ homeassistant_ssh_publica | dirname }}"
        state: directory
        mode: "0755"

    - name: Copia legible de la pública
      ansible.builtin.copy:
        src: "{{ homeassistant_config_dir }}/ssh/id_ed25519.pub"
        dest: "{{ homeassistant_ssh_publica }}"
        remote_src: true
        mode: "0644"
      # En seco, la primera vez aún no existe
      when: homeassistant_ssh_pub.stat.exists

- name: Compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ homeassistant_dir }}/compose.yaml"
    mode: "0644"
  notify: Aplicar compose de homeassistant

- name: Unidad systemd
  ansible.builtin.template:
    src: homeassistant.service.j2
    dest: /etc/systemd/system/homeassistant.service
    mode: "0644"
  register: homeassistant_unit
  notify: Recargar systemd

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Servicio
  ansible.builtin.systemd_service:
    name: homeassistant.service
    enabled: true
    state: started
  when: not (ansible_check_mode and homeassistant_unit.changed)

# El primer arranque instala dependencias y tarda
- name: Responde
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ homeassistant_port }}/manifest.json
  register: homeassistant_check
  until: homeassistant_check.status == 200
  retries: 36
  delay: 5
  changed_when: false
  when: not ansible_check_mode
