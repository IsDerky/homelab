---
# Compose y unidad
homeassistant_dir: /opt/homeassistant
# Configuración y datos (.storage, BD del historial). Fuera de /opt para que
# la copia vuelque las SQLite con .backup (backup_sistema_extra).
homeassistant_config_dir: /var/lib/homeassistant
homeassistant_image: ghcr.io/home-assistant/home-assistant:2026.11.2

# Red del host (descubrimiento, Wake on LAN, dispositivos de la LAN). El puerto
# no se abre en ufw: se entra por nginx.
homeassistant_port: 8123
homeassistant_mem: 1g
homeassistant_tz: Etc/UTC

# Días de historial en la BD (recorder)
homeassistant_recorder_dias: 10

# Clave SSH propia (ed25519, sin frase) en <config>/ssh/id_ed25519, para
# shell_command contra otras máquinas con orden forzada en el otro lado. La
# pública se copia a homeassistant_ssh_publica, legible sin root.
homeassistant_ssh_clave: false
homeassistant_ssh_publica: /etc/homeassistant/id_ed25519.pub

# Paquetes de configuración que lleva Ansible, en <config>/packages/<nombre>.yaml:
#   homeassistant_packages:
#     luces: "{{ lookup('file', 'luces.yaml') }}"
homeassistant_packages: {}
