---
- name: Faltan datos del NAS
  ansible.builtin.assert:
    that:
      - nas_password | length > 0
      - nas_hosts_allow | length > 0
    fail_msg: Define nas_password (con Ansible Vault) y nas_hosts_allow.
    quiet: true

- name: Paquetes
  ansible.builtin.apt:
    name: samba
    state: present

- name: Usuario del NAS (sin shell)
  ansible.builtin.user:
    name: "{{ nas_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    password_lock: true

# Si la carpeta es un punto de montaje y el disco no está, sería una carpeta
# vacía en el disco del sistema y Samba guardaría ahí los archivos
- name: La carpeta del NAS tiene que estar montada
  ansible.builtin.command: mountpoint -q {{ nas_path }}
  changed_when: false
  when: nas_require_mount | bool

- name: Dueño y permisos de la carpeta
  ansible.builtin.file:
    path: "{{ nas_path }}"
    state: directory
    owner: "{{ nas_user }}"
    group: "{{ nas_user }}"
    mode: "0770"

- name: Configuración de Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
    validate: testparm -s %s
  notify: Reiniciar samba

# NetBIOS fuera: el recurso se abre por IP o nombre DNS
- name: Sin nmbd
  ansible.builtin.systemd_service:
    name: nmbd.service
    state: stopped
    enabled: false
    masked: true

- name: Servicio smbd
  ansible.builtin.systemd_service:
    name: smbd.service
    enabled: true
    state: started

- name: ¿Existe ya el usuario de Samba?
  ansible.builtin.command: pdbedit -L -u {{ nas_user }}
  register: nas_samba_user
  changed_when: false
  failed_when: false

# Solo al crearlo. Para cambiar la contraseña: smbpasswd {{ nas_user }} en el
# servidor (y actualizar el vault)
- name: Usuario de Samba
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n%s\n' "$NAS_PASSWORD" "$NAS_PASSWORD" | smbpasswd -a -s {{ nas_user }}
  args:
    executable: /bin/bash
  environment:
    NAS_PASSWORD: "{{ nas_password }}"
  when: nas_samba_user.rc != 0
  no_log: true
  changed_when: true

- name: El recurso responde
  ansible.builtin.wait_for:
    port: 445
    host: 127.0.0.1
    timeout: 30
