---
- name: Faltan datos del NAS
  ansible.builtin.assert:
    that:
      - nas_password | length > 0
      - nas_hosts_allow | length > 0
    fail_msg: Define nas_password (con Ansible Vault) y nas_hosts_allow.
    quiet: true

- name: Paquetes
  ansible.builtin.apt:
    name: samba
    state: present

- name: Usuario del NAS (sin shell)
  ansible.builtin.user:
    name: "{{ nas_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
    password_lock: true

# Si la carpeta es un punto de montaje y el disco no está, sería una carpeta
# vacía en el disco del sistema y Samba guardaría ahí los archivos
- name: La carpeta del NAS tiene que estar montada
  ansible.builtin.command: mountpoint -q {{ nas_path }}
  changed_when: false
  when: nas_require_mount | bool

- name: Dueño y permisos de la carpeta
  ansible.builtin.file:
    path: "{{ nas_path }}"
    state: directory
    owner: "{{ nas_user }}"
    group: "{{ nas_user }}"
    mode: "0770"

# Lectores: ACL de lectura en lo que ya hay (solo la primera vez, -R) y por
# defecto para lo nuevo. El dueño y los permisos de Samba no cambian.
- name: Herramientas de ACL
  ansible.builtin.apt:
    name: acl
    state: present
  when: nas_lectores | length > 0 or nas_carpetas_propias | length > 0

- name: ¿Tienen ya los lectores su ACL?
  ansible.builtin.shell: |
    set -o pipefail
    getfacl -p {{ nas_path }} | grep -qx 'user:{{ item }}:r-x' &&
    getfacl -p {{ nas_path }} | grep -qx 'default:user:{{ item }}:r-x'
  args:
    executable: /bin/bash
  loop: "{{ nas_lectores }}"
  register: nas_lectores_acl
  changed_when: false
  failed_when: false

- name: ACL de lectura para los lectores
  ansible.builtin.command: >-
    setfacl -R -m u:{{ item.item }}:rX -m d:u:{{ item.item }}:rX {{ nas_path }}
  loop: "{{ nas_lectores_acl.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

# Carpeta propia: escribible por el usuario local y por Samba ({{ nas_user }}),
# y lo que cree cualquiera de los dos lo puede cambiar el otro
- name: Carpetas propias
  ansible.builtin.file:
    path: "{{ nas_path }}/{{ item.nombre }}"
    state: directory
    owner: "{{ nas_user }}"
    group: "{{ nas_user }}"
    mode: "2770"
  loop: "{{ nas_carpetas_propias }}"
  loop_control:
    label: "{{ item.nombre }}"

- name: ACL de las carpetas propias
  ansible.posix.acl:
    path: "{{ nas_path }}/{{ item.0.nombre }}"
    entity: "{{ item.0.usuario if item.1.tipo == 'user' else nas_user }}"
    etype: "{{ item.1.tipo }}"
    permissions: rwX
    default: "{{ item.1.defecto }}"
    state: present
  loop: >-
    {{ nas_carpetas_propias | product([
         {'tipo': 'user', 'defecto': false}, {'tipo': 'user', 'defecto': true},
         {'tipo': 'group', 'defecto': false}, {'tipo': 'group', 'defecto': true}
       ]) | list }}
  loop_control:
    label: "{{ item.0.nombre }} {{ item.1.tipo }}{{ ' (defecto)' if item.1.defecto else '' }}"

- name: Configuración de Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
    validate: testparm -s %s
  notify: Reiniciar samba

# NetBIOS fuera: el recurso se abre por IP o nombre DNS
- name: Sin nmbd
  ansible.builtin.systemd_service:
    name: nmbd.service
    state: stopped
    enabled: false
    masked: true

- name: Servicio smbd
  ansible.builtin.systemd_service:
    name: smbd.service
    enabled: true
    state: started

- name: ¿Existe ya el usuario de Samba?
  ansible.builtin.command: pdbedit -L -u {{ nas_user }}
  register: nas_samba_user
  changed_when: false
  failed_when: false

# Solo al crearlo. Para cambiar la contraseña: smbpasswd {{ nas_user }} en el
# servidor (y actualizar el vault)
- name: Usuario de Samba
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n%s\n' "$NAS_PASSWORD" "$NAS_PASSWORD" | smbpasswd -a -s {{ nas_user }}
  args:
    executable: /bin/bash
  environment:
    NAS_PASSWORD: "{{ nas_password }}"
  when: nas_samba_user.rc != 0
  no_log: true
  changed_when: true

- name: El recurso responde
  ansible.builtin.wait_for:
    port: 445
    host: 127.0.0.1
    timeout: 30
