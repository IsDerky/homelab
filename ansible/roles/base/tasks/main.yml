---
- name: Zona horaria
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Paquetes básicos
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Enmascarados: ni otro paquete ni un socket pueden volver a arrancarlos
- name: Servicios que no se usan
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ base_masked_services }}"

# La forma documentada de apagarlo: con este fichero, el generador de systemd
# no añade sus unidades al arranque
- name: Cloud-init desactivado
  ansible.builtin.copy:
    content: ""
    dest: /etc/cloud/cloud-init.disabled
    force: false
    mode: "0644"
  when: base_disable_cloud_init

- name: Usuario de administración
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash

- name: Claves SSH del usuario de administración
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{{ item }}"
  loop: "{{ base_admin_keys }}"
  loop_control:
    label: "{{ item.split() | last }}"
