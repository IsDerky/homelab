---
base_timezone: Europe/Madrid

# Lo que tiene que estar siempre instalado
base_packages:
  - ca-certificates
  - curl
  - git
  - htop
  - jq
  - nano
  - rsync
  - tree
  - unattended-upgrades

# Servicios que tienen que estar parados y enmascarados (p. ej. restos de
# escritorio). Con su .socket si lo tienen, o el socket lo volvería a arrancar.
base_masked_services: []

# cloud-init solo hace falta en el primer arranque de una imagen de nube; en
# una máquina instalada a mano sigue mirando la red y el disco en cada arranque
base_disable_cloud_init: false

# Usuario con sudo para no tener que entrar como root
base_admin_user: admin

# Claves públicas que pueden entrar con ese usuario
base_admin_keys: []
