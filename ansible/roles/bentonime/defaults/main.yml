---
bentonime_user: bentonime
bentonime_home: /home/bentonime
# Grupos extra: render para que ffmpeg pueda usar la GPU (/dev/dri)
bentonime_groups: [render]

bentonime_memory_max: 6G
# Dominio dado de alta en Umami (umami_sitios del rol umami): la unidad lee su
# /etc/umami/<dominio>.env con UMAMI_WEBSITE_ID. Vacío = sin analítica.
bentonime_umami_dominio: ""
bentonime_tasks_max: 200
