---
- name: Paquetes
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - python3-certbot-dns-cloudflare
    state: present

# El nginx.conf de Ubuntu trae TLS 1.0 y 1.1 de serie. Los vhosts de certbot ya
# los quitan con su include, pero un server con TLS sin ese include los heredaría
- name: Solo TLS 1.2 y 1.3 por defecto
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*ssl_protocols\s'
    line: "\tssl_protocols TLSv1.2 TLSv1.3;"
    backrefs: true
  notify:
    - Comprobar nginx
    - Recargar nginx

- name: Sin el vhost por defecto
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - Comprobar nginx
    - Recargar nginx

- name: Vhosts
  ansible.builtin.copy:
    src: "{{ nginx_sites_dir }}/{{ item.name }}.conf"
    dest: /etc/nginx/sites-available/{{ item.name }}.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Comprobar nginx
    - Recargar nginx

- name: Vhosts activos
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item.name }}.conf
    dest: /etc/nginx/sites-enabled/{{ item.name }}.conf
    state: link
    # En --check los vhosts nuevos no se han copiado de verdad
    force: "{{ ansible_check_mode }}"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(true)
  notify:
    - Comprobar nginx
    - Recargar nginx

- name: Vhosts preparados sin activar
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/{{ item.name }}.conf
    state: absent
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.enabled | default(true))
  notify:
    - Comprobar nginx
    - Recargar nginx

# Los certificados no se piden aquí: en una máquina nueva se restaura
# /etc/letsencrypt del backup antes de este rol (si no, nginx -t falla).
- name: Carpeta de secretos de certbot
  ansible.builtin.file:
    path: /root/.secrets
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: nginx_certbot_cloudflare_ini | length > 0

- name: Token de Cloudflare para certbot
  ansible.builtin.copy:
    content: "{{ nginx_certbot_cloudflare_ini }}"
    dest: /root/.secrets/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: nginx_certbot_cloudflare_ini | length > 0

# reconfigure prueba la renovación (dry-run) con el método nuevo y solo lo
# guarda si funciona; el certificado actual no se toca
- name: Renovación por DNS de Cloudflare
  ansible.builtin.shell: >-
    grep -qx 'authenticator = dns-cloudflare' /etc/letsencrypt/renewal/{{ item }}.conf
    && echo sin-cambios
    || certbot reconfigure -n --cert-name {{ item }} --authenticator dns-cloudflare
    --dns-cloudflare-credentials /root/.secrets/cloudflare.ini
    --dns-cloudflare-propagation-seconds 30
  register: nginx_certbot_reconfigure
  changed_when: "'sin-cambios' not in nginx_certbot_reconfigure.stdout"
  loop: "{{ nginx_certbot_dns_certs }}"

# Después del token: el certificado de la LAN lo necesita. Los vhosts de
# arriba se comprueban al final (handler), cuando el certificado ya existe.
- name: Nombres de la LAN
  ansible.builtin.import_tasks: lan.yml
  when: nginx_lan_names | length > 0

- name: Hooks de certbot al renovar
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Gestionado por Ansible (rol nginx)
      case "$RENEWED_LINEAGE" in
        */{{ item.cert }}) {{ item.command }} ;;
      esac
    dest: /etc/letsencrypt/renewal-hooks/deploy/{{ item.name }}
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nginx_certbot_deploy_hooks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Renovación automática
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

- name: Servicio nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    enabled: true
    state: started

- name: Aplicar cambios de nginx antes de comprobar
  ansible.builtin.meta: flush_handlers

- name: Webs activas responden
  ansible.builtin.uri:
    url: "{{ item.check.url }}"
    headers:
      Host: "{{ item.check.host }}"
    status_code: 200
  loop: "{{ nginx_sites | selectattr('check', 'defined') }}"
  loop_control:
    label: "{{ item.name }}: {{ item.check.host }}"
  when: item.enabled | default(true)
