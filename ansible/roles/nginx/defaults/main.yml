---
# Vhosts: <nginx_sites_dir>/<name>.conf → sites-available. enabled: false lo
# deja preparado sin activar. check (opcional): URL que tiene que dar 200 con
# esa cabecera Host cuando el vhost está activo.
#   - name: web
#     enabled: true
#     check:
#       url: http://127.0.0.1:8084/
#       host: web.example.com
nginx_sites: []

# Por defecto, files/nginx junto al inventario (los vhosts son de cada servidor)
nginx_sites_dir: "{{ inventory_dir }}/files/nginx"

# Contenido de /root/.secrets/cloudflare.ini para certbot con DNS-01
# (dns_cloudflare_api_token = …). Con Ansible Vault. Vacío = no se instala.
nginx_certbot_cloudflare_ini: ""

# Certificados (nombre en certbot) que se renuevan por DNS-01 con ese token en
# vez de por HTTP en el puerto 80. Así no dependen de que el 80 esté abierto
# ni de por dónde llegue el tráfico web (p. ej. detrás de un túnel).
nginx_certbot_dns_certs: []

# Comando a lanzar cuando se renueva un certificado concreto. Para servicios
# que leen el certificado solo al arrancar.
#   - name: wings
#     cert: node.example.com
#     command: systemctl restart wings
nginx_certbot_deploy_hooks: []

# Servicios solo de la LAN, cada uno con su nombre: registro A en Cloudflare
# (sin proxy) a nginx_lan_ip y un certificado comodín *.<zona> por DNS-01 que
# los cubre a todos (necesita nginx_certbot_cloudflare_ini). El acceso lo
# limita cada vhost (allow 192.168.1.0/24). Añadir un servicio = un nombre aquí
# y su vhost con el certificado nginx_lan_cert.
nginx_lan_zone: ""
nginx_lan_ip: ""
nginx_lan_names: []
nginx_lan_cert: lan
# Zona vieja durante un cambio de dominio: el comodín la cubre también (los
# registros A siguen donde estén, no se tocan). Al cambiarla, cambiar también
# nginx_lan_cert para que se saque un certificado nuevo.
nginx_lan_zone_alias: ""
