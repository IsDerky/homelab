---
adguard_dir: /opt/adguard
adguard_image: adguard/adguardhome:v0.107.79

# IP donde escucha el DNS (53 tcp/udp). Obligatoria: en 127.0.0.53:53 ya está
# systemd-resolved, así que no puede ser 0.0.0.0.
adguard_dns_listen: ""

# Panel (y DoH) solo en loopback, para nginx
adguard_panel_port: 3000

# Unbound como resolvedor recursivo detrás de AdGuard: pregunta directamente a
# los servidores raíz y valida DNSSEC, sin pasar por Quad9, Cloudflare, etc.
adguard_unbound: false
adguard_unbound_image: klutchell/unbound:1.26.2
# Red propia del compose con IP fija para Unbound (AdGuard la usa como upstream)
adguard_network_subnet: 172.31.53.0/24
adguard_unbound_ip: 172.31.53.53
# Por si Unbound no responde. Vacío = los upstream que tuviera AdGuard antes.
adguard_fallback_dns: []
# Upstream por dominio que no pasan por Unbound, con la sintaxis de AdGuard
# ("[/dominio/]upstream"). Útil para CDNs que eligen nodo según la IP de quien
# pregunta y a veces dan uno caído.
adguard_upstream_extra: []
# Dominios propios que pueden responder con IP de la LAN. Unbound descarta esas
# respuestas (protección contra DNS rebinding) y sin esto no resuelven.
adguard_unbound_private_domains: []
