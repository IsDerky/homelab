---
- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# up -d solo recrea el contenedor si el compose ha cambiado
- name: Aplicar compose de adguard
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ adguard_dir }}"
  changed_when: true

- name: Reiniciar adguard
  ansible.builtin.command: docker compose restart adguardhome
  args:
    chdir: "{{ adguard_dir }}"
  changed_when: true

# AdGuard también, para que olvide las respuestas vacías que tenga en caché
- name: Reiniciar unbound
  ansible.builtin.command: docker compose restart unbound adguardhome
  args:
    chdir: "{{ adguard_dir }}"
  changed_when: true
