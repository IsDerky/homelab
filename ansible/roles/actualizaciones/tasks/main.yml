---
- name: Paquete unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# Lo mismo que deja `dpkg-reconfigure unattended-upgrades`, pero sin depender
# de lo que traiga la imagen
- name: Activar las actualizaciones automáticas
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# En un fichero propio: 50unattended-upgrades es del paquete y se queda como
# viene (orígenes de seguridad)
- name: Ajustes propios
  ansible.builtin.template:
    src: 52homelab.j2
    dest: /etc/apt/apt.conf.d/52homelab
    owner: root
    group: root
    mode: "0644"

- name: Comprobar needrestart
  ansible.builtin.stat:
    path: /etc/needrestart/conf.d
  register: actualizaciones_needrestart

- name: Servicios que needrestart no reinicia
  ansible.builtin.template:
    src: needrestart.conf.j2
    dest: /etc/needrestart/conf.d/homelab.conf
    owner: root
    group: root
    mode: "0644"
  when: actualizaciones_needrestart.stat.isdir | default(false)

- name: Timers de apt activos
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# La configuración se lee bien: apt-config la vuelca sin errores y con
# nuestros valores
- name: Comprobar la configuración
  ansible.builtin.command: apt-config dump Unattended-Upgrade::Automatic-Reboot APT::Periodic::Unattended-Upgrade
  register: actualizaciones_dump
  changed_when: false
  failed_when: >-
    actualizaciones_dump.rc != 0
    or 'APT::Periodic::Unattended-Upgrade "1"' not in actualizaciones_dump.stdout
  when: not ansible_check_mode
