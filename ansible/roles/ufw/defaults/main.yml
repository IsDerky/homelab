---
ufw_default_policy:
  incoming: deny
  outgoing: allow
  routed: deny

ufw_logging: low

# El rol se niega a seguir si ninguna regla abre este puerto
ufw_ssh_port: 22

# Cada regla: port (obligatorio), proto, from (por defecto any), rule (allow),
# interface (solo lo que entra por ahí), comment, delete (true = quitarla).
# Sin proto = tcp y udp.
#   - port: "22"
#     proto: tcp
#     from: 192.168.1.0/24
#     comment: SSH LAN
#   - port: "9100"
#     proto: tcp
#     interface: wg0
#     comment: node-exporter por el túnel
ufw_rules: []
