---
# En una máquina sin CrowdSec: solo el bouncer de iptables, contra la API de la
# máquina que sí lo tiene (crowdsec_lapi_remota, por un túnel). La clave la deja
# en hostvars esa máquina en la misma pasada (tasks/bouncers_remotos.yml).
- name: Repositorio
  ansible.builtin.import_tasks: repo.yml

- name: Bouncer de iptables
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: present
    update_cache: "{{ crowdsec_repo is changed }}"
  register: crowdsec_bouncer_pkg
  when: not (ansible_check_mode and crowdsec_repo.changed)

- name: La clave se ha leído en esta pasada
  ansible.builtin.assert:
    that: crowdsec_clave | length > 0
    fail_msg: >-
      No hay clave para {{ crowdsec_bouncer_nombre }}: va en la misma pasada que
      {{ crowdsec_servidor }}, con {{ crowdsec_bouncer_nombre }} en sus crowdsec_bouncers_remotos
    quiet: true
  when: not ansible_check_mode

# .local: el bouncer lo mezcla con su yaml y las actualizaciones no lo pisan
- name: API remota y cadenas
  ansible.builtin.copy:
    content: |
      # Gestionado por Ansible (rol crowdsec, bouncer remoto)
      api_url: http://{{ crowdsec_lapi_remota }}/
      api_key: {{ crowdsec_clave }}
      iptables_chains:
      {% for c in crowdsec_bouncer_chains %}
        - {{ c }}
      {% endfor %}
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode or crowdsec_clave | length > 0
  no_log: true
  notify: Reiniciar el bouncer

- name: Carpeta del drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: crowdsec_bouncer_exentos | length > 0

# El bouncer se pone el primero de INPUT al arrancar: la excepción tiene que
# entrar después, y por eso va atada a su arranque y no a ufw.
- name: Puertos que el bouncer no corta
  ansible.builtin.copy:
    content: |
      # Gestionado por Ansible (rol crowdsec, bouncer remoto)
      [Service]
      {% for r in crowdsec_bouncer_exentos %}
      ExecStartPost=/usr/sbin/iptables -w -I INPUT 1 -p {{ r.proto }} --dport {{ r.puerto }} -m comment --comment crowdsec-exento -j ACCEPT
      ExecStopPost=-/usr/sbin/iptables -w -D INPUT -p {{ r.proto }} --dport {{ r.puerto }} -m comment --comment crowdsec-exento -j ACCEPT
      {% endfor %}
    dest: /etc/systemd/system/crowdsec-firewall-bouncer.service.d/exentos.conf
    owner: root
    group: root
    mode: "0644"
  when: crowdsec_bouncer_exentos | length > 0
  notify:
    - Quitar las excepciones anteriores
    - Reiniciar el bouncer

- name: Sin puertos exentos
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service.d/exentos.conf
    state: absent
  when: crowdsec_bouncer_exentos | length == 0
  notify:
    - Quitar las excepciones anteriores
    - Reiniciar el bouncer

- name: En marcha
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    enabled: true
    state: started
  when: not (ansible_check_mode and (crowdsec_repo.changed or crowdsec_bouncer_pkg.changed))

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: El bouncer está en iptables
  ansible.builtin.shell: set -o pipefail && iptables-save | grep -c -i crowdsec
  args:
    executable: /bin/bash
  register: crowdsec_iptables
  until: crowdsec_iptables.rc == 0
  retries: 6
  delay: 5
  changed_when: false
  when: not ansible_check_mode
