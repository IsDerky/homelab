---
- name: Paquetes
  ansible.builtin.apt:
    name: [conntrack, python3]
    state: present

- name: Carpeta del textfile
  ansible.builtin.file:
    path: "{{ abuso_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Script
  ansible.builtin.copy:
    src: abuso-contenedores
    dest: /usr/local/sbin/abuso-contenedores
    owner: root
    group: root
    mode: "0755"

- name: Unidades
  ansible.builtin.template:
    src: abuso-contenedores.{{ item }}.j2
    dest: /etc/systemd/system/abuso-contenedores.{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: abuso_units

- name: Timer
  ansible.builtin.systemd_service:
    name: abuso-contenedores.timer
    enabled: true
    state: started
    daemon_reload: "{{ abuso_units.changed }}"
  when: not (ansible_check_mode and abuso_units.changed)
