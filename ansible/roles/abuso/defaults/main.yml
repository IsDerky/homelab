# monitoring (ConexionAPoolDeMineria, TraficoSalienteAnomalo).
abuso_textfile_dir: /var/lib/node-exporter/textfile
abuso_puertos_pool: [3333, 4444, 5555, 6666, 9999, 14433, 14444, 45560, 45700]
