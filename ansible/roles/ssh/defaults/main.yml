---
# Usuarios que pueden entrar (usuario o usuario@ip). Vacío = cualquiera.
ssh_allow_users: []

ssh_password_authentication: false
ssh_permit_root_login: prohibit-password
ssh_x11_forwarding: false

# Con más de 3 claves en el agente, ssh puede agotar los intentos antes de
# llegar a la buena: IdentitiesOnly o -i en el cliente
ssh_max_auth_tries: 3
# VERBOSE apunta la huella de la clave con la que entra cada uno
ssh_log_level: VERBOSE
ssh_client_alive_count_max: 2

# Certificados de usuario firmados por una CA propia. Claves públicas de la CA
# (una por línea); vacío = sin certificados. Las authorized_keys siguen valiendo,
# así que añadir la CA no deja a nadie fuera.
#   ssh_trusted_user_ca_keys:
#     - ssh-ed25519 AAAA... ca-homelab
ssh_trusted_user_ca_keys: []
# Qué principals del certificado entran como cada usuario. Un usuario sin
# entrada no entra con certificado (solo con sus authorized_keys).
#   ssh_authorized_principals:
#     root: [admin]
#     backup: [copias]
ssh_authorized_principals: {}
# Claves (públicas o de certificado) revocadas: no entran aunque el
# certificado siga vigente. El fichero existe siempre (sshd rechaza todas las
# claves si RevokedKeys apunta a un fichero que no está).
ssh_revoked_keys: []

# Bloques Match al final del fichero:
#   - match: User backup Address 10.0.0.5
#     options:
#       PermitTTY: false
ssh_match_blocks: []
