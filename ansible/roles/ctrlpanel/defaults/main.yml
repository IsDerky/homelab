---
# CtrlPanel (Laravel): solo la parte de sistema. El código y el .env se traen
# del sitio anterior (playbooks/migrar-ctrlpanel.yml); el rol no los genera.
ctrlpanel_dir: /var/www/ctrlpanel
ctrlpanel_user: ctrlpanel
ctrlpanel_php: "8.3"
# Usuario de nginx: solo puede atravesar ctrlpanel_dir para leer public/
ctrlpanel_nginx_user: www-data

# Nombre con el que se entra. Obligatorio.
ctrlpanel_server_name: ""
# nginx solo en loopback: delante va el túnel de Cloudflare
ctrlpanel_port: 8085

# Base de datos en el MariaDB local. La contraseña, en el vault.
ctrlpanel_db_name: ctrlpanel
ctrlpanel_db_user: ctrlpanel
ctrlpanel_db_password: ""

# Cola y planificador. El planificador cobra créditos y suspende servidores en
# Pterodactyl: con dos copias encendidas a la vez lo haría dos veces. false =
# todo instalado pero parado (para preparar una migración).
ctrlpanel_enabled: false

# Comprobar al final que /login da 200. false durante la migración, mientras
# la app sigue en mantenimiento.
ctrlpanel_check: true

# Carpeta del colector textfile de node-exporter: deja ahí cada 5 min los
# trabajos fallidos de la cola (ctrlpanel_failed_jobs). Vacío = sin métricas.
ctrlpanel_textfile_dir: ""

ctrlpanel_fpm_max_children: 5
ctrlpanel_log_level: error
