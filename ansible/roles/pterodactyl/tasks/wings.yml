---
- name: Versión de Wings instalada
  ansible.builtin.command: /usr/local/bin/wings version
  register: pterodactyl_wings_instalada
  changed_when: false
  failed_when: false
  check_mode: false

# La primera línea dice sabor y versión (pterodactyl_wings_patron_version).
# Pendiente = instalado otro sabor u otra versión, y este playbook no puede cambiarlo.
- name: ¿Wings va por detrás?
  ansible.builtin.set_fact:
    pterodactyl_wings_al_dia: >-
      {{ pterodactyl_wings_instalada.rc == 0
         and (pterodactyl_wings_instalada.stdout_lines[0] | default(''))
             is search(pterodactyl_wings_patron_version) }}
    pterodactyl_wings_pendiente: >-
      {{ pterodactyl_wings_instalada.rc == 0
         and not (pterodactyl_wings_instalada.stdout_lines[0] | default(''))
                 is search(pterodactyl_wings_patron_version)
         and not (pterodactyl_wings_actualizar | bool) }}

# Para volver atrás si el nuevo no arranca bien (lo hace wings-etapas.yml)
- name: Copia del binario anterior de Wings
  ansible.builtin.copy:
    src: /usr/local/bin/wings
    dest: /usr/local/bin/wings.anterior
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - pterodactyl_wings_actualizar | bool
    - pterodactyl_wings_instalada.rc == 0
    - not (pterodactyl_wings_al_dia | bool)

# Calagopus reescribe config.yml con sus claves: si hay que volver al oficial,
# se vuelve también a la config de antes
- name: Copia de la config anterior de Wings
  ansible.builtin.copy:
    src: /etc/pterodactyl/config.yml
    dest: /etc/pterodactyl/config.yml.anterior
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - pterodactyl_wings_actualizar | bool
    - pterodactyl_wings_instalada.rc == 0
    - not (pterodactyl_wings_al_dia | bool)

- name: Aviso de Wings por detrás
  ansible.builtin.debug:
    msg: >-
      Instalado: {{ pterodactyl_wings_instalada.stdout_lines[0] }}. El rol pide
      {{ pterodactyl_wings_sabor }} {{ pterodactyl_wings_objetivo }}; se cambia con playbooks/wings-etapas.yml.
  when: pterodactyl_wings_pendiente | bool

- name: Binario de Wings
  when: not (pterodactyl_wings_pendiente | bool)
  ansible.builtin.get_url:
    url: "{{ pterodactyl_wings_binario_url }}"
    dest: /usr/local/bin/wings
    checksum: "sha256:{{ pterodactyl_wings_binario_sha256[pterodactyl_arch] }}"
    owner: root
    group: root
    mode: "0755"
  vars:
    pterodactyl_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
  notify: Reiniciar wings

- name: Unidad de Wings
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recargar systemd
    - Reiniciar wings

- name: Carpeta de ajustes de Wings
  ansible.builtin.file:
    path: /etc/systemd/system/wings.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Límite de ficheros abiertos de Wings
  ansible.builtin.template:
    src: wings-limites.conf.j2
    dest: /etc/systemd/system/wings.service.d/limites.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recargar systemd
    - Reiniciar wings

# Lleva el token del nodo: con él se controlan todos los servidores. Wings lo
# escribe con 0600, pero una copia a mano puede dejarlo legible para todos.
- name: Configuración de Wings solo para root
  ansible.builtin.file:
    path: /etc/pterodactyl/config.yml
    owner: root
    group: root
    mode: "0600"
  # Antes de configurar el nodo en el panel todavía no existe
  failed_when: false

- name: Wings activo
  ansible.builtin.systemd_service:
    name: wings.service
    enabled: true
    state: started
