---
- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Recargar docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: reloaded

# Los servidores de juego siguen: son contenedores y Wings se reengancha al
# volver. Se cortan unos segundos la consola web y el SFTP.
- name: Reiniciar wings
  ansible.builtin.systemd_service:
    name: wings.service
    state: restarted

- name: Reiniciar pteroq
  ansible.builtin.systemd_service:
    name: pteroq.service
    state: restarted
