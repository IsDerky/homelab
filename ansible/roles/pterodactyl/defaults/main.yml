---
# Wings con versión fija y el SHA-256 de cada binario (los da la API de GitHub
# de la release). Si el que hay instalado ya coincide, no se descarga nada.
# renovate: datasource=github-releases depName=pterodactyl/wings
pterodactyl_wings_version: 1.13.5
pterodactyl_wings_sha256:
  amd64: 231134aa6d5aa02aac4f6384b50c76860637858cbc056268b9f96ac42f7f5393
  arm64: 04303d7cb19e4037902d154d4f07eb643b948429f8fdc0adbc6bf7ea93f31897

# Cambiar de versión reinicia Wings en todos los nodos a la vez. Por eso aquí
# solo se instala si falta: subir de versión lo hace playbooks/wings-etapas.yml,
# un nodo cada vez, con canario y vuelta atrás si algo falla.
pterodactyl_wings_actualizar: false

# De dónde baja el binario (las pruebas lo cambian por un servidor local)
pterodactyl_wings_url: "https://github.com/pterodactyl/wings/releases/download/v{{ pterodactyl_wings_version }}/wings_linux_{{ pterodactyl_arch }}"

# wings-etapas.yml: segundos que espera tras el canario (grupo wings_canario) y
# tras cada uno de los demás, antes de comprobar que Wings sigue bien
pterodactyl_wings_pausa_canario: 600
pterodactyl_wings_pausa_resto: 60

# La unidad de ejemplo de Pterodactyl trae 4096 y Wings avisa al arrancar de
# que se queda corto (http=2304 sftp=768)
pterodactyl_wings_nofile: 65536

# Que los contenedores sigan vivos mientras dockerd se reinicia. Sin esto,
# actualizar docker-ce (unattended-upgrades no lo cubre, es de un repo de
# fuera) reinicia todos los servidores de juego.
pterodactyl_docker_live_restore: true

# Panel: solo en el nodo que lo tiene
pterodactyl_panel: false
pterodactyl_panel_dir: /var/www/pterodactyl
pterodactyl_panel_user: www-data
pterodactyl_php: /usr/bin/php
