---
- name: Vigilancia de los paneles
  when: vigilancia_paneles_ip | length > 0 or vigilancia_paneles_trampas | length > 0
  block:
    - name: Script vigilancia-paneles
      ansible.builtin.copy:
        src: vigilancia-paneles
        dest: /usr/local/sbin/vigilancia-paneles
        owner: root
        group: root
        mode: "0755"

    # Lleva los correos de las trampas: solo root
    - name: Configuración
      ansible.builtin.copy:
        content: "{{ {'ip': vigilancia_paneles_ip, 'trampas': vigilancia_paneles_trampas} | to_nice_json }}\n"
        dest: /etc/vigilancia-paneles.json
        owner: root
        group: root
        mode: "0600"

    - name: Unidades vigilancia-paneles
      ansible.builtin.template:
        src: vigilancia-paneles.{{ item }}.j2
        dest: /etc/systemd/system/vigilancia-paneles.{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: vigilancia_paneles_units

    - name: Timer de vigilancia-paneles
      ansible.builtin.systemd_service:
        name: vigilancia-paneles.timer
        enabled: true
        state: started
        daemon_reload: "{{ vigilancia_paneles_units.changed }}"
      when: not (ansible_check_mode and vigilancia_paneles_units.changed)
