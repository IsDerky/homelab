---
- name: Carpeta de descargas
  ansible.builtin.file:
    path: /var/cache/backup-binarios
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Versión de restic instalada
  ansible.builtin.command: /usr/local/bin/restic version
  register: backup_restic_actual
  changed_when: false
  failed_when: false
  check_mode: false

- name: Instalar restic {{ backup_restic_version }}
  when: ("restic " ~ backup_restic_version ~ " ") not in backup_restic_actual.stdout | default('')
  block:
    - name: Descargar restic
      ansible.builtin.get_url:
        url: "https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{ backup_restic_version }}_linux_{{ backup_arch }}.bz2"
        dest: /var/cache/backup-binarios/restic_{{ backup_restic_version }}.bz2
        checksum: "sha256:{{ backup_restic_sha256[backup_arch] }}"
        mode: "0600"

    # Se escribe al lado y se mueve: si algo falla a medias, el restic de antes sigue
    - name: Descomprimir restic
      ansible.builtin.shell: |
        set -o pipefail
        bunzip2 -c /var/cache/backup-binarios/restic_{{ backup_restic_version }}.bz2 > /usr/local/bin/.restic.nuevo
        chmod 0755 /usr/local/bin/.restic.nuevo
        /usr/local/bin/.restic.nuevo version | grep -qF "restic {{ backup_restic_version }} "
        mv /usr/local/bin/.restic.nuevo /usr/local/bin/restic
      args:
        executable: /bin/bash
      changed_when: true

- name: Versión de rclone instalada
  ansible.builtin.command: /usr/local/bin/rclone version
  register: backup_rclone_actual
  changed_when: false
  failed_when: false
  check_mode: false

- name: Instalar rclone {{ backup_rclone_version }}
  when: ("rclone v" ~ backup_rclone_version ~ "\n") not in backup_rclone_actual.stdout | default('')
  block:
    - name: Descargar rclone
      ansible.builtin.get_url:
        url: "https://downloads.rclone.org/v{{ backup_rclone_version }}/rclone-v{{ backup_rclone_version }}-linux-{{ backup_arch }}.zip"
        dest: /var/cache/backup-binarios/rclone_{{ backup_rclone_version }}.zip
        checksum: "sha256:{{ backup_rclone_sha256[backup_arch] }}"
        mode: "0600"

    - name: Descomprimir rclone
      ansible.builtin.shell: |
        set -o pipefail
        unzip -p /var/cache/backup-binarios/rclone_{{ backup_rclone_version }}.zip \
          'rclone-v{{ backup_rclone_version }}-linux-{{ backup_arch }}/rclone' > /usr/local/bin/.rclone.nuevo
        chmod 0755 /usr/local/bin/.rclone.nuevo
        /usr/local/bin/.rclone.nuevo version | head -1 | grep -qxF "rclone v{{ backup_rclone_version }}"
        mv /usr/local/bin/.rclone.nuevo /usr/local/bin/rclone
      args:
        executable: /bin/bash
      changed_when: true

# Al final, con los nuevos ya en /usr/local/bin: un timer que salte en medio
# no se queda sin restic. Los de Ubuntu dejarían otro restic/rclone viejo en /usr/bin.
- name: Quitar restic y rclone de apt
  ansible.builtin.apt:
    name: [restic, rclone]
    state: absent
