---
- name: Recargar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Aplicar compose de bd-servidores
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ bd_servidores_dir }}"
  changed_when: true
  when: not ansible_check_mode

# pg_hba.conf va montado como fichero suelto: Ansible lo sustituye por otro y el
# contenedor seguiría viendo el viejo hasta reiniciarse. Va después del compose
# (los handlers corren en el orden en que están aquí).
- name: Reiniciar PostgreSQL
  ansible.builtin.command: docker restart bd-servidores-postgres
  changed_when: true
  when: not ansible_check_mode
