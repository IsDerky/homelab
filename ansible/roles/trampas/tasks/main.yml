---
- name: ¿Existen ya?
  ansible.builtin.stat:
    path: "{{ item.ruta }}"
  loop: "{{ trampas_ficheros }}"
  loop_control:
    label: "{{ item.ruta }}"
  register: trampas_stat

- name: Leer los que ya existen
  ansible.builtin.slurp:
    src: "{{ item.item.ruta }}"
  loop: "{{ trampas_stat.results | selectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item.ruta }}"
  register: trampas_actuales
  no_log: true

# Un fichero de verdad con el mismo nombre se respeta
- name: Ficheros de verdad que no se tocan
  ansible.builtin.debug:
    msg: "{{ item.item.item.ruta }} ya existe y no es la trampa: no se toca"
  loop: "{{ trampas_actuales.results }}"
  loop_control:
    label: "{{ item.item.item.ruta }}"
  when: (item.content | b64decode | trim) != (item.item.item.contenido | trim)

- name: Ficheros trampa
  ansible.builtin.copy:
    content: "{{ item.contenido | trim }}\n"
    dest: "{{ item.ruta }}"
    owner: "{{ item.usuario | default('root') }}"
    group: "{{ item.usuario | default('root') }}"
    mode: "0600"
    # Lo que ya existe (sea la trampa o no) no se reescribe
    force: false
  loop: "{{ trampas_ficheros }}"
  loop_control:
    label: "{{ item.ruta }}"
  no_log: true

- name: Entradas SSH trampa
  ansible.builtin.blockinfile:
    path: "{{ (item.usuario == 'root') | ternary('/root', '/home/' ~ item.usuario) }}/.ssh/config"
    create: true
    owner: "{{ item.usuario }}"
    group: "{{ item.usuario }}"
    mode: "0600"
    marker: "# {mark} {{ item.host }}"
    block: |
      Host {{ item.host }}
          HostName {{ item.hostname }}
          Port {{ item.puerto }}
          User root
          IdentityFile {{ item.clave }}
          IdentitiesOnly yes
  loop: "{{ trampas_ssh }}"
  loop_control:
    label: "{{ item.usuario }} → {{ item.host }}"

- name: Vigilante de Cowrie
  when: trampas_cowrie_log | length > 0
  block:
    - name: Script trampa-cowrie
      ansible.builtin.copy:
        src: trampa-cowrie
        dest: /usr/local/sbin/trampa-cowrie
        owner: root
        group: root
        mode: "0755"

    - name: Unidades trampa-cowrie
      ansible.builtin.template:
        src: trampa-cowrie.{{ item }}.j2
        dest: /etc/systemd/system/trampa-cowrie.{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: trampas_cowrie_units

    - name: Timer de trampa-cowrie
      ansible.builtin.systemd_service:
        name: trampa-cowrie.timer
        enabled: true
        state: started
        daemon_reload: "{{ trampas_cowrie_units.changed }}"
      when: not (ansible_check_mode and trampas_cowrie_units.changed)
