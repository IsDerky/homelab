---
monitoring_dir: /opt/monitoring

monitoring_images:
  prometheus: prom/prometheus:v3.15.1
  alertmanager: prom/alertmanager:v0.34.1
  blackbox: prom/blackbox-exporter:v0.29.1
  node_exporter: prom/node-exporter:v1.12.1
  grafana: grafana/grafana:13.2.4
  cadvisor: ghcr.io/google/cadvisor:v0.60.6

# Todo escucha en 127.0.0.1 (red del host, sin puertos publicados por Docker).
# cAdvisor no en su 8080 de siempre, que es el de Wings.
monitoring_ports:
  prometheus: 9090
  alertmanager: 9093
  blackbox: 9115
  node_exporter: 9100
  grafana: 3005
  cadvisor: 9338
  ops_exporter: 9850
  alert_dm: 9851

# Topes por contenedor: la máquina tiene más cosas que hacer
monitoring_mem:
  prometheus: 512m
  alertmanager: 64m
  blackbox: 64m
  node_exporter: 64m
  grafana: 384m
  cadvisor: 256m

# Métricas por contenedor. false = sin cAdvisor.
monitoring_cadvisor: true

# Lo primero que se cumpla de las dos
monitoring_retention_time: 15d
monitoring_retention_size: 2GB

monitoring_scrape_interval: 30s

# node-exporter de otras máquinas (job "nodos", etiqueta nodo). target = IP:puerto,
# normalmente por un túnel: no tiene autenticación.
#   - nombre: nodo1
#     target: 10.0.0.2:9100
monitoring_remote_nodes: []

# Comprobaciones HTTP con blackbox. El cuerpo tiene que casar con body_regex.
#   - servicio: web
#     url: http://127.0.0.1:3000/api/health
#     body_regex: '"ok":true'
monitoring_http_probes: []

# Objetivo de disponibilidad (SLO) de las comprobaciones HTTP, en 30 días
monitoring_slo_target: 0.995

# Comprobaciones de contenido: una ruta concreta tiene que dar 200 y un cuerpo
# que case con body_regex (una API que depende de algo más que la app, un
# estático que nginx tiene que poder leer). No cuentan en el SLO y van más
# despacio que el resto: pueden ser caras. timeout como mucho 85s.
#   - nombre: api
#     url: https://ejemplo.com/api/datos
#     body_regex: '"ok":true'
#     timeout: 60s
monitoring_content_probes: []
monitoring_content_interval: 15m

# Comprobaciones TLS: que el servicio responda por HTTPS con un certificado
# válido, sin mirar el cuerpo (Wings da 401 sin token). Avisan si cae o si el
# certificado caduca en menos de 14 días. No cuentan en el SLO.
#   - nombre: nodo1
#     url: https://nodo1.ejemplo.com:8080/
monitoring_tls_probes: []

# Unidades systemd cuyo estado exporta node-exporter (node_systemd_unit_state),
# con el nombre completo: nginx.service, certbot.timer... Son expresiones
# regulares (actions.runner.* vale para todos los runners). Las lee un timer del
# host (systemd-textfile): el colector systemd necesita D-Bus y AppArmor no se
# lo deja al contenedor.
monitoring_systemd_units: []

# Carpeta del colector textfile de node-exporter
monitoring_textfile_dir: /var/lib/node-exporter/textfile

# Nombre del nodo de Wings local en las métricas de servidores de juego (los
# remotos salen con el dominio que tienen en wings-nodes.env)
monitoring_wings_local_node: local

# Snapshot de ops-collect y el grupo que puede leerlo. Vacío = sin ops-exporter.
monitoring_ops_snapshot: /var/lib/ops-collect/snapshot.json
monitoring_ops_group: ""

# Alertas por DM con discord-dm (rol avisos). false = Alertmanager sin receptor.
monitoring_alert_dm: true

# Grafana. root_url por si va detrás de nginx en un subdirectorio.
monitoring_grafana_admin_password: ""
monitoring_grafana_root_url: http://127.0.0.1:3005/
monitoring_grafana_anonymous_viewer: false
