# promtool test rules tests/alertas_test.yml (desde la carpeta del rol)
rule_files:
  - ../files/rules/alertas.yml

evaluation_interval: 30s

tests:
  # Caída total: a los 5 min ya supera las dos ventanas; con el for de 2 min,
  # avisa a los 7. Antes no.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x60 0x30"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x90"
    alert_rule_test:
      - eval_time: 33m
        alertname: SLOQuemaRapida
        exp_alerts: []
      - eval_time: 38m
        alertname: SLOQuemaRapida
        exp_alerts:
          - exp_labels:
              severity: critical
              servicio: web
            exp_annotations:
              summary: "web está fallando: a este ritmo se gasta el margen de error del mes en unos 2 días."

  # Un fallo suelto de vez en cuando no gasta el margen deprisa: no avisa
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x20 0 1x20 0 1x20 0 1x20"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x90"
    alert_rule_test:
      - eval_time: 40m
        alertname: SLOQuemaRapida
        exp_alerts: []

  # Se arregla: la ventana de 5 min deja de pasar el umbral y se apaga, aunque
  # la de 1 h siga alta
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x60 0x30 1x20"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x120"
    alert_rule_test:
      - eval_time: 55m
        alertname: SLOQuemaRapida
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4"}'
        values: "50x30"
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DiscoCasiLleno
        exp_alerts:
          - exp_labels:
              severity: critical
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Queda menos del 10 % del disco (5% libre)."

  # Un nodo de fuera: el aviso dice cuál
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="nodos", nodo="n1", mountpoint="/", fstype="ext4"}'
        values: "50x30"
      - series: 'node_filesystem_size_bytes{job="nodos", nodo="n1", mountpoint="/", fstype="ext4"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DiscoCasiLleno
        exp_alerts:
          - exp_labels:
              severity: critical
              job: nodos
              nodo: n1
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "n1: Queda menos del 10 % del disco (5% libre)."

  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: "100x20"
      - series: 'node_memory_MemTotal_bytes'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: MemoriaAgotada
        exp_alerts: []

  # Copia local fallida: avisa a los 5 min
  - interval: 1m
    input_series:
      - series: 'ops_backup_run_success{modo="sistema", destino="local"}'
        values: "1x5 0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: BackupLocalFallido
        exp_alerts: []
      - eval_time: 12m
        alertname: BackupLocalFallido
        exp_alerts:
          - exp_labels:
              severity: warning
              modo: sistema
              destino: local
            exp_annotations:
              summary: "La copia local de sistema ha fallado (journalctl -u server-backup@sistema)."

  # Atrasada: la del NAS sí avisa; la de sistema en Drive no (la vigila el
  # vigilante externo) aunque esté igual de atrasada
  - interval: 1m
    input_series:
      - series: 'ops_backup_run_last_success_timestamp_seconds{modo="nas", destino="drive"}'
        values: "0x40"
      - series: 'ops_backup_run_max_age_seconds{modo="nas", destino="drive"}'
        values: "600x40"
      - series: 'ops_backup_run_success{modo="nas", destino="drive"}'
        values: "1x40"
      - series: 'ops_backup_run_last_success_timestamp_seconds{modo="sistema", destino="drive"}'
        values: "0x40"
      - series: 'ops_backup_run_max_age_seconds{modo="sistema", destino="drive"}'
        values: "600x40"
      - series: 'ops_backup_run_success{modo="sistema", destino="drive"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupAtrasado
        exp_alerts:
          - exp_labels:
              severity: critical
              modo: nas
              destino: drive
            exp_annotations:
              summary: "No hay una copia buena de nas (drive) desde hace 30m 0s."

  # Sin respuesta: avisa a los 10 min, no antes (un reinicio de Wings no cuenta)
  - interval: 1m
    input_series:
      - series: 'probe_success{job="tls", nombre="n1", instance="https://n1.invalid:8080/"}'
        values: "1x5 0x20"
      - series: 'probe_success{job="tls", nombre="n2", instance="https://n2.invalid:8080/"}'
        values: "1x5 0x3 1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: SinRespuestaHTTPS
        exp_alerts: []
      - eval_time: 17m
        alertname: SinRespuestaHTTPS
        exp_alerts:
          - exp_labels:
              severity: critical
              job: tls
              nombre: n1
              instance: https://n1.invalid:8080/
            exp_annotations:
              summary: "n1 no responde por HTTPS desde hace 10 min (https://n1.invalid:8080/)."

  # Certificado a 10 días avisa; a 40 no
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="tls", nombre="n1"}'
        values: "864000x80"
      - series: 'probe_ssl_earliest_cert_expiry{job="tls", nombre="n2"}'
        values: "3456000x80"
    alert_rule_test:
      - eval_time: 70m
        alertname: CertificadoPorCaducar
        exp_alerts:
          - exp_labels:
              severity: warning
              job: tls
              nombre: n1
            exp_annotations:
              summary: "El certificado de n1 caduca en 9d 22h 50m 0s."

  # Contenido: dos fallos seguidos (cada 15 min) avisan; uno suelto no
  - interval: 15m
    input_series:
      - series: 'probe_success{job="contenido", nombre="api", instance="https://a.invalid/api"}'
        values: "1 1 0 0 0 0"
      - series: 'probe_success{job="contenido", nombre="css", instance="https://b.invalid/x.css"}'
        values: "1 1 0 1 1 1"
    alert_rule_test:
      - eval_time: 45m
        alertname: ContenidoRoto
        exp_alerts: []
      - eval_time: 55m
        alertname: ContenidoRoto
        exp_alerts:
          - exp_labels:
              severity: critical
              job: contenido
              nombre: api
              instance: https://a.invalid/api
            exp_annotations:
              summary: "api no devuelve lo esperado (https://a.invalid/api)."

  # Pool de minería: una conexión suelta de 2 min no avisa; 5 min seguidos sí
  - interval: 1m
    input_series:
      - series: 'contenedor_conexiones_pool{instance="nodo-a", servidor="abcd1234"}'
        values: "0x5 1 1 0x5 2x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: ConexionAPoolDeMineria
        exp_alerts: []
      - eval_time: 19m
        alertname: ConexionAPoolDeMineria
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: nodo-a
              servidor: abcd1234
            exp_annotations:
              summary: >-
                El servidor abcd1234 (nodo-a) lleva 5 min conectado a puertos típicos de pools de minería (2 conexiones).
                Mirar su CPU antes de actuar; no se entra en el servidor.

  # Tráfico saliente: un pico de destinos no avisa; 10 min de SYN sin respuesta sí
  - interval: 1m
    input_series:
      - series: 'contenedor_destinos_distintos{instance="nodo-a", servidor="abcd1234"}'
        values: "20x3 900x3 20x30"
      - series: 'contenedor_syn_sin_respuesta{instance="nodo-a", servidor="abcd1234"}'
        values: "0x15 500x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraficoSalienteAnomalo
        exp_alerts: []
      - eval_time: 30m
        alertname: TraficoSalienteAnomalo
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: nodo-a
              servidor: abcd1234
            exp_annotations:
              summary: >-
                El servidor abcd1234 (nodo-a) abre conexiones a muchísimos destinos o sin respuesta desde hace 10 min
                (escaneo o ataque saliente).

  # El latido está siempre activo, sin depender de ninguna serie
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Latido de la cadena de alertas: si deja de llegar al vigilante externo, algo de Prometheus, Alertmanager o alert-dm no funciona."
