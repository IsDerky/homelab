# promtool test rules tests/alertas_test.yml (desde la carpeta del rol)
rule_files:
  - ../files/rules/alertas.yml

evaluation_interval: 30s

tests:
  # Caída total: a los 5 min ya supera las dos ventanas; con el for de 2 min,
  # avisa a los 7. Antes no.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x60 0x30"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x90"
    alert_rule_test:
      - eval_time: 33m
        alertname: SLOQuemaRapida
        exp_alerts: []
      - eval_time: 38m
        alertname: SLOQuemaRapida
        exp_alerts:
          - exp_labels:
              severity: critical
              servicio: web
            exp_annotations:
              summary: "web está fallando: a este ritmo se gasta el margen de error del mes en unos 2 días."

  # Un fallo suelto de vez en cuando no gasta el margen deprisa: no avisa
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x20 0 1x20 0 1x20 0 1x20"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x90"
    alert_rule_test:
      - eval_time: 40m
        alertname: SLOQuemaRapida
        exp_alerts: []

  # Se arregla: la ventana de 5 min deja de pasar el umbral y se apaga, aunque
  # la de 1 h siga alta
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox", servicio="web"}'
        values: "1x60 0x30 1x20"
      - series: 'slo:objetivo{servicio="web"}'
        values: "0.995x120"
    alert_rule_test:
      - eval_time: 55m
        alertname: SLOQuemaRapida
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/", fstype="ext4"}'
        values: "50x30"
      - series: 'node_filesystem_size_bytes{mountpoint="/", fstype="ext4"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DiscoCasiLleno
        exp_alerts:
          - exp_labels:
              severity: critical
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "Queda menos del 10 % del disco (5% libre)."

  # Un nodo de fuera: el aviso dice cuál
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="nodos", nodo="n1", mountpoint="/", fstype="ext4"}'
        values: "50x30"
      - series: 'node_filesystem_size_bytes{job="nodos", nodo="n1", mountpoint="/", fstype="ext4"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DiscoCasiLleno
        exp_alerts:
          - exp_labels:
              severity: critical
              job: nodos
              nodo: n1
              mountpoint: /
              fstype: ext4
            exp_annotations:
              summary: "n1: Queda menos del 10 % del disco (5% libre)."

  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: "100x20"
      - series: 'node_memory_MemTotal_bytes'
        values: "1000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: MemoriaAgotada
        exp_alerts: []

  # Copia local fallida: avisa a los 5 min
  - interval: 1m
    input_series:
      - series: 'ops_backup_run_success{modo="sistema", destino="local"}'
        values: "1x5 0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: BackupLocalFallido
        exp_alerts: []
      - eval_time: 12m
        alertname: BackupLocalFallido
        exp_alerts:
          - exp_labels:
              severity: warning
              modo: sistema
              destino: local
            exp_annotations:
              summary: "La copia local de sistema ha fallado (journalctl -u server-backup@sistema)."

  # Atrasada: la del NAS sí avisa; la de sistema en Drive no (la vigila el
  # vigilante externo) aunque esté igual de atrasada
  - interval: 1m
    input_series:
      - series: 'ops_backup_run_last_success_timestamp_seconds{modo="nas", destino="drive"}'
        values: "0x40"
      - series: 'ops_backup_run_max_age_seconds{modo="nas", destino="drive"}'
        values: "600x40"
      - series: 'ops_backup_run_success{modo="nas", destino="drive"}'
        values: "1x40"
      - series: 'ops_backup_run_last_success_timestamp_seconds{modo="sistema", destino="drive"}'
        values: "0x40"
      - series: 'ops_backup_run_max_age_seconds{modo="sistema", destino="drive"}'
        values: "600x40"
      - series: 'ops_backup_run_success{modo="sistema", destino="drive"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupAtrasado
        exp_alerts:
          - exp_labels:
              severity: critical
              modo: nas
              destino: drive
            exp_annotations:
              summary: "No hay una copia buena de nas (drive) desde hace 30m 0s."

  # Sin respuesta: avisa a los 10 min, no antes (un reinicio de Wings no cuenta)
  - interval: 1m
    input_series:
      - series: 'probe_success{job="tls", nombre="n1", instance="https://n1.invalid:8080/"}'
        values: "1x5 0x20"
      - series: 'probe_success{job="tls", nombre="n2", instance="https://n2.invalid:8080/"}'
        values: "1x5 0x3 1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: SinRespuestaHTTPS
        exp_alerts: []
      - eval_time: 17m
        alertname: SinRespuestaHTTPS
        exp_alerts:
          - exp_labels:
              severity: critical
              job: tls
              nombre: n1
              instance: https://n1.invalid:8080/
            exp_annotations:
              summary: "n1 no responde por HTTPS desde hace 10 min (https://n1.invalid:8080/)."

  # Certificado a 10 días avisa; a 40 no
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="tls", nombre="n1"}'
        values: "864000x80"
      - series: 'probe_ssl_earliest_cert_expiry{job="tls", nombre="n2"}'
        values: "3456000x80"
    alert_rule_test:
      - eval_time: 70m
        alertname: CertificadoPorCaducar
        exp_alerts:
          - exp_labels:
              severity: warning
              job: tls
              nombre: n1
            exp_annotations:
              summary: "El certificado de n1 caduca en 9d 22h 50m 0s."

  # Contenido: dos fallos seguidos (cada 15 min) avisan; uno suelto no
  - interval: 15m
    input_series:
      - series: 'probe_success{job="contenido", nombre="api", instance="https://a.invalid/api"}'
        values: "1 1 0 0 0 0"
      - series: 'probe_success{job="contenido", nombre="css", instance="https://b.invalid/x.css"}'
        values: "1 1 0 1 1 1"
    alert_rule_test:
      - eval_time: 45m
        alertname: ContenidoRoto
        exp_alerts: []
      - eval_time: 55m
        alertname: ContenidoRoto
        exp_alerts:
          - exp_labels:
              severity: critical
              job: contenido
              nombre: api
              instance: https://a.invalid/api
            exp_annotations:
              summary: "api no devuelve lo esperado (https://a.invalid/api)."

  # Planificador: corre cada minuto hasta el 30 y se para
  - interval: 1m
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{name="ctrlpanel-planificador.timer"}'
        values: "0+60x30 1800x80"
    alert_rule_test:
      - eval_time: 85m
        alertname: PlanificadorParado
        exp_alerts: []
      - eval_time: 100m
        alertname: PlanificadorParado
        exp_alerts:
          - exp_labels:
              severity: critical
              name: ctrlpanel-planificador.timer
            exp_annotations:
              summary: "El planificador de CtrlPanel no se ejecuta desde hace 1h 10m 0s."

  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="ctrlpanel-planificador.service", state="failed"}'
        values: "0x5 1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PlanificadorFallando
        exp_alerts: []
      - eval_time: 22m
        alertname: PlanificadorFallando
        exp_alerts:
          - exp_labels:
              severity: critical
              name: ctrlpanel-planificador.service
              state: failed
            exp_annotations:
              summary: "El planificador de CtrlPanel falla en cada ejecución desde hace 15 min (journalctl -u ctrlpanel-planificador)."

  # Los 9 viejos no avisan; uno nuevo sí
  - interval: 5m
    input_series:
      - series: 'ctrlpanel_failed_jobs'
        values: "9x20 10x20"
    alert_rule_test:
      - eval_time: 95m
        alertname: TrabajosFallidosCtrlPanel
        exp_alerts: []
      - eval_time: 105m
        alertname: TrabajosFallidosCtrlPanel
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "CtrlPanel tiene trabajos de la cola fallidos nuevos (1 en la última hora; php artisan queue:failed)."

  # Un pago sin confirmar avisa a los 5 min; cuando se arregla, deja de avisar
  - interval: 1m
    input_series:
      - series: 'ctrlpanel_pagos_sin_confirmar'
        values: "0x10 1x10 0x10"
      - series: 'ctrlpanel_compras_atascadas'
        values: "0x10 2x10"
    alert_rule_test:
      - eval_time: 14m
        alertname: PagoSinConfirmar
        exp_alerts: []
      - eval_time: 16m
        alertname: PagoSinConfirmar
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "1 pago(s) de CtrlPanel llevan más de 30 min sin confirmar: el webhook de Stripe no llega o falla (Stripe → Webhooks)."
      - eval_time: 25m
        alertname: PagoSinConfirmar
        exp_alerts: []
      - eval_time: 16m
        alertname: CompraAtascada
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "2 compra(s) pagadas en CtrlPanel siguen sin hacerse tras 15 min (tabla derkyu_compras, estado pagada)."

  # Las fallidas viejas no avisan; una nueva sí
  - interval: 5m
    input_series:
      - series: 'ctrlpanel_compras_fallidas'
        values: "3x20 4x20"
    alert_rule_test:
      - eval_time: 95m
        alertname: CompraFallida
        exp_alerts: []
      - eval_time: 105m
        alertname: CompraFallida
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "1 compra(s) pagadas en CtrlPanel fallaron en la última hora; el dinero quedó como saldo (derkyu_compras)."
