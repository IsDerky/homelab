# Reglas y alertas. Solo avisan de problemas graves: lo demás (backups,
# certificados de este servidor, servidor caído entero, SMART) ya lo avisan el
# vigilante externo, el bot y smartd, y repetirlo aquí sería ruido. Los nodos de
# Wings de fuera no los mira nadie más: esos sí.
groups:
  # Proporción de comprobaciones HTTP fallidas en varias ventanas. slo:objetivo
  # (por servicio) sale del inventario, en slo.yml.
  - name: slo
    rules:
      - record: slo:probe_errors:ratio_rate5m
        expr: 1 - avg by (servicio) (avg_over_time(probe_success{job="blackbox"}[5m]))
      - record: slo:probe_errors:ratio_rate30m
        expr: 1 - avg by (servicio) (avg_over_time(probe_success{job="blackbox"}[30m]))
      - record: slo:probe_errors:ratio_rate1h
        expr: 1 - avg by (servicio) (avg_over_time(probe_success{job="blackbox"}[1h]))
      - record: slo:probe_errors:ratio_rate6h
        expr: 1 - avg by (servicio) (avg_over_time(probe_success{job="blackbox"}[6h]))
      - record: slo:probe_errors:ratio_rate30d
        expr: 1 - avg by (servicio) (avg_over_time(probe_success{job="blackbox"}[30d]))

  - name: alertas
    rules:
      # Quema rápida del margen de error (multiventana, como en el libro de SRE
      # de Google): a 14,4 veces el ritmo permitido, el margen del mes se acaba
      # en ~2 días. La ventana de 5 min hace que deje de avisar en cuanto se
      # arregla, sin esperar a que se vacíe la de 1 h.
      - alert: SLOQuemaRapida
        expr: |
          slo:probe_errors:ratio_rate1h > on (servicio) (14.4 * (1 - slo:objetivo))
          and
          slo:probe_errors:ratio_rate5m > on (servicio) (14.4 * (1 - slo:objetivo))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.servicio }} está fallando: a este ritmo se gasta el margen de error del mes en unos 2 días."

      - alert: DiscoCasiLleno
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.10
        for: 15m
        labels:
          severity: critical
        annotations:
          # Con la etiqueta nodo (los de fuera) delante; el servidor no la lleva
          summary: "{{ with $labels.nodo }}{{ . }}: {{ end }}Queda menos del 10 % del disco ({{ $value | humanizePercentage }} libre)."

      - alert: MemoriaAgotada
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ with $labels.nodo }}{{ . }}: {{ end }}Queda menos del 5 % de RAM disponible ({{ $value | humanizePercentage }})."

      # Si una pieza de la monitorización deja de responder, las alertas que
      # dependen de ella tampoco saltarían
      - alert: ObjetivoCaido
        expr: up == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus no puede leer {{ $labels.job }} ({{ $labels.instance }}) desde hace 15 min."

      # Copia local (disco USB): un fallo, o el disco desconectado. Los fallos de
      # Drive ya avisan por DM desde el propio script.
      - alert: BackupLocalFallido
        expr: ops_backup_run_success{destino="local"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La copia local de {{ $labels.modo }} ha fallado (¿disco USB desconectado?)."

      # Demasiado tiempo sin una copia buena (el máximo lo pone el script por
      # modo). Sistema y clientes en Drive ya los vigila el vigilante externo.
      - alert: BackupAtrasado
        expr: |
          (time() - ops_backup_run_last_success_timestamp_seconds > ops_backup_run_max_age_seconds)
          unless on (modo, destino) ops_backup_run_success{destino="drive", modo=~"sistema|clientes"}
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No hay una copia buena de {{ $labels.modo }} ({{ $labels.destino }}) desde hace {{ $value | humanizeDuration }}."

      # Comprobaciones TLS (nodos de Wings, panel y webs). 10 min para no avisar por
      # un reinicio de Wings, que tarda unos segundos.
      - alert: SinRespuestaHTTPS
        expr: probe_success{job="tls"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.nombre }} no responde por HTTPS desde hace 10 min ({{ $labels.instance }})."

      # Wings lee el certificado solo al arrancar: si renueva y nadie lo
      # reinicia, sigue sirviendo el viejo hasta que caduca. Certbot renueva a
      # 30 días, así que a 14 algo ha fallado.
      - alert: CertificadoPorCaducar
        expr: probe_ssl_earliest_cert_expiry{job="tls"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "El certificado de {{ $labels.nombre }} caduca en {{ $value | humanizeDuration }}."

      # Comprobaciones de contenido: van cada 15 min, más que la ventana con la
      # que Prometheus busca el último valor (5 min), así que se mira con
      # last_over_time. Dos fallos seguidos.
      - alert: ContenidoRoto
        expr: last_over_time(probe_success{job="contenido"}[20m]) == 0
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.nombre }} no devuelve lo esperado ({{ $labels.instance }})."

      # El planificador de CtrlPanel cobra y suspende: si se para, nadie lo nota
      - alert: PlanificadorParado
        expr: time() - node_systemd_timer_last_trigger_seconds{name="ctrlpanel-planificador.timer"} > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "El planificador de CtrlPanel no se ejecuta desde hace {{ $value | humanizeDuration }}."

      # Corre cada minuto: si lleva 15 seguidos en failed, no es un fallo suelto
      - alert: PlanificadorFallando
        expr: node_systemd_unit_state{name="ctrlpanel-planificador.service", state="failed"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "El planificador de CtrlPanel falla en cada ejecución desde hace 15 min (journalctl -u ctrlpanel-planificador)."

      - alert: TrabajosFallidosCtrlPanel
        expr: ctrlpanel_failed_jobs - ctrlpanel_failed_jobs offset 1h > 0
        labels:
          severity: warning
        annotations:
          summary: "CtrlPanel tiene trabajos de la cola fallidos nuevos ({{ $value }} en la última hora; php artisan queue:failed)."

      - alert: RecolectorParado
        expr: time() - ops_snapshot_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ops-collect no actualiza el snapshot desde hace más de 30 min."
