---
- name: Falta la contraseña de admin de Grafana
  ansible.builtin.assert:
    that: monitoring_grafana_admin_password | length > 0
    fail_msg: Define monitoring_grafana_admin_password (con Ansible Vault).
    quiet: true

- name: Comprobar que Docker Compose v2 está instalado
  ansible.builtin.command: docker compose version
  changed_when: false

# Prometheus y Alertmanager corren como nobody (65534) y Grafana como 472
- name: Carpetas
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "" }
    - { path: prometheus }
    - { path: prometheus/rules }
    - { path: alertmanager }
    - { path: blackbox }
    - { path: grafana }
    - { path: grafana/provisioning }
    - { path: grafana/provisioning/datasources }
    - { path: grafana/provisioning/dashboards }
    - { path: grafana/dashboards }
    - { path: data, mode: "0750" }
    - { path: data/prometheus, owner: "65534", mode: "0750" }
    - { path: data/alertmanager, owner: "65534", mode: "0750" }
    - { path: data/grafana, owner: "472", mode: "0750" }
  loop_control:
    label: "{{ item.path or monitoring_dir }}"

# Antes de la configuración: las validaciones de abajo usan estas imágenes
- name: Descargar imágenes
  ansible.builtin.command: docker pull {{ item }}
  loop: "{{ monitoring_images.values() | list }}"
  register: monitoring_pull
  changed_when: "'Downloaded newer image' in monitoring_pull.stdout"

- name: Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Aplicar compose

- name: Configuración de Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/c.yml:ro --entrypoint promtool
      {{ monitoring_images.prometheus }} check config --syntax-only /c.yml
  notify: Recargar prometheus

- name: Reglas y alertas
  ansible.builtin.copy:
    src: rules/alertas.yml
    dest: "{{ monitoring_dir }}/prometheus/rules/alertas.yml"
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/r.yml:ro --entrypoint promtool
      {{ monitoring_images.prometheus }} check rules /r.yml
  notify: Recargar prometheus

- name: Reglas de más
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ monitoring_dir }}/prometheus/rules/{{ item | basename }}"
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/r.yml:ro --entrypoint promtool
      {{ monitoring_images.prometheus }} check rules /r.yml
  loop: "{{ monitoring_reglas_extra }}"
  notify: Recargar prometheus

- name: Objetivos de disponibilidad
  ansible.builtin.template:
    src: slo.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/rules/slo.yml"
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/r.yml:ro --entrypoint promtool
      {{ monitoring_images.prometheus }} check rules /r.yml
  notify: Recargar prometheus

- name: Configuración de Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
    mode: "0644"
    validate: >-
      docker run --rm --user 0 -v %s:/a.yml:ro --entrypoint amtool
      {{ monitoring_images.alertmanager }} check-config /a.yml
  notify: Recargar alertmanager

- name: Configuración de blackbox
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ monitoring_dir }}/blackbox/blackbox.yml"
    mode: "0644"
  notify: Recargar blackbox

# Restos de cuando la configuración se montaba fichero a fichero
- name: Quitar la configuración de la estructura anterior
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: absent
  loop:
    - prometheus.yml
    - rules
    - alertmanager.yml
    - blackbox.yml
  notify: Aplicar compose

- name: Variables de Grafana (con la contraseña de admin)
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ monitoring_dir }}/grafana.env"
    mode: "0600"
  no_log: true
  notify: Aplicar compose

- name: Fuente de datos de Grafana
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Reiniciar grafana

- name: Proveedor de dashboards
  ansible.builtin.copy:
    src: grafana-dashboards.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/homelab.yml"
    mode: "0644"
  notify: Reiniciar grafana

# Grafana los relee solo cada minuto
- name: Dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ monitoring_dir }}/grafana/dashboards/"
    mode: "0644"

- name: Dashboards de más
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ monitoring_dir }}/grafana/dashboards/{{ item | basename }}"
    mode: "0644"
  loop: "{{ monitoring_dashboards_extra }}"

- name: Exportador de ops-collect
  when: monitoring_ops_group | length > 0
  block:
    - name: Script ops-exporter
      ansible.builtin.copy:
        src: ops-exporter
        dest: /usr/local/bin/ops-exporter
        mode: "0755"
      notify: Reiniciar ops-exporter

    - name: Unidad ops-exporter
      ansible.builtin.template:
        src: ops-exporter.service.j2
        dest: /etc/systemd/system/ops-exporter.service
        mode: "0644"
      notify:
        - Recargar systemd
        - Reiniciar ops-exporter

- name: Avisos por DM
  when: monitoring_alert_dm
  block:
    - name: Script alert-dm
      ansible.builtin.copy:
        src: alert-dm
        dest: /usr/local/bin/alert-dm
        mode: "0755"
      notify: Reiniciar alert-dm

    - name: Unidad alert-dm
      ansible.builtin.template:
        src: alert-dm.service.j2
        dest: /etc/systemd/system/alert-dm.service
        mode: "0644"
      notify:
        - Recargar systemd
        - Reiniciar alert-dm

- name: Qué ha cambiado (anotaciones de Grafana y avisos)
  when: monitoring_cambios
  block:
    - name: Script cambios-recoger
      ansible.builtin.copy:
        src: cambios-recoger
        dest: /usr/local/bin/cambios-recoger
        mode: "0755"

    - name: Contraseña de Grafana para las anotaciones
      ansible.builtin.template:
        src: cambios.env.j2
        dest: /etc/cambios.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Unidades cambios-recoger
      ansible.builtin.template:
        src: cambios-recoger.{{ item }}.j2
        dest: /etc/systemd/system/cambios-recoger.{{ item }}
        mode: "0644"
      loop: [service, timer]
      register: monitoring_cambios_units
      notify: Recargar systemd

- name: Histórico de RAM por servidor
  when: monitoring_ram_historico
  block:
    - name: Script ram-servidores
      ansible.builtin.copy:
        src: ram-servidores
        dest: /usr/local/bin/ram-servidores
        mode: "0755"

    - name: Unidades ram-servidores
      ansible.builtin.template:
        src: ram-servidores.{{ item }}.j2
        dest: /etc/systemd/system/ram-servidores.{{ item }}
        mode: "0644"
      loop: [service, timer]
      register: monitoring_ram_units
      notify: Recargar systemd

- name: Carpeta del colector textfile
  ansible.builtin.file:
    path: "{{ monitoring_textfile_dir }}"
    state: directory
    mode: "0755"

- name: Caducidades a vigilar
  ansible.builtin.template:
    src: caducidades.prom.j2
    dest: "{{ monitoring_textfile_dir }}/caducidades.prom"
    mode: "0644"

- name: Precio de la luz
  ansible.builtin.copy:
    content: |
      # Gestionado por Ansible (monitoring_precio_kwh)
      # HELP luz_precio_kwh_euros Precio del kWh con impuestos
      # TYPE luz_precio_kwh_euros gauge
      luz_precio_kwh_euros {{ monitoring_precio_kwh }}
    dest: "{{ monitoring_textfile_dir }}/luz.prom"
    mode: "0644"
  when: monitoring_precio_kwh | string | length > 0

- name: Sonda del bloqueo de Cloudflare
  when: monitoring_bloqueo_cf_dominios | length > 0
  block:
    - name: Script bloqueo-cloudflare
      ansible.builtin.copy:
        src: bloqueo-cloudflare
        dest: /usr/local/bin/bloqueo-cloudflare
        mode: "0755"

    - name: Unidades bloqueo-cloudflare
      ansible.builtin.template:
        src: bloqueo-cloudflare.{{ item }}.j2
        dest: /etc/systemd/system/bloqueo-cloudflare.{{ item }}
        mode: "0644"
      loop: [service, timer]
      register: monitoring_cf_units
      notify: Recargar systemd

- name: Caducidad de los dominios
  when: monitoring_dominios | length > 0
  block:
    - name: Script caducidad-dominios
      ansible.builtin.copy:
        src: caducidad-dominios
        dest: /usr/local/bin/caducidad-dominios
        mode: "0755"

    - name: Unidades caducidad-dominios
      ansible.builtin.template:
        src: caducidad-dominios.{{ item }}.j2
        dest: /etc/systemd/system/caducidad-dominios.{{ item }}
        mode: "0644"
      loop: [service, timer]
      register: monitoring_dominios_units
      notify: Recargar systemd

- name: Estado de unidades systemd
  when: monitoring_systemd_units | length > 0
  block:
    - name: Script systemd-textfile
      ansible.builtin.copy:
        src: systemd-textfile
        dest: /usr/local/bin/systemd-textfile
        mode: "0755"

    - name: Unidades systemd-textfile
      ansible.builtin.template:
        src: systemd-textfile.{{ item }}.j2
        dest: /etc/systemd/system/systemd-textfile.{{ item }}
        mode: "0644"
      loop: [service, timer]
      notify: Recargar systemd

- name: Unidad monitoring
  ansible.builtin.template:
    src: monitoring.service.j2
    dest: /etc/systemd/system/monitoring.service
    mode: "0644"
  notify: Recargar systemd

- name: Recargar systemd si hay unidades nuevas
  ansible.builtin.meta: flush_handlers

# en seco una unidad nueva no llega a existir (cambios-recoger la primera vez): se arranca en la pasada de verdad
- name: Servicios
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: >-
    {{ ['monitoring.service']
       + (['systemd-textfile.timer'] if monitoring_systemd_units | length > 0 else [])
       + (['ops-exporter.service'] if monitoring_ops_group | length > 0 else [])
       + (['alert-dm.service'] if monitoring_alert_dm else [])
       + (['cambios-recoger.timer'] if monitoring_cambios and not (ansible_check_mode and monitoring_cambios_units is changed) else [])
       + (['ram-servidores.timer'] if monitoring_ram_historico and not (ansible_check_mode and monitoring_ram_units is changed) else [])
       + (['bloqueo-cloudflare.timer'] if monitoring_bloqueo_cf_dominios | length > 0
          and not (ansible_check_mode and monitoring_cf_units is changed) else [])
       + (['caducidad-dominios.timer'] if monitoring_dominios | length > 0
          and not (ansible_check_mode and monitoring_dominios_units is changed) else []) }}

# Sin esperar a la pasada de las 06:00: la métrica sale ya (y con la lista nueva)
- name: Primera consulta de los dominios
  ansible.builtin.systemd_service:
    name: caducidad-dominios.service
    state: started
  when: monitoring_dominios | length > 0 and monitoring_dominios_units is changed and not ansible_check_mode

- name: Esperar a que escuchen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 90
  loop: >-
    {{ [monitoring_ports.prometheus, monitoring_ports.alertmanager, monitoring_ports.blackbox,
        monitoring_ports.node_exporter, monitoring_ports.grafana]
       + ([monitoring_ports.cadvisor] if monitoring_cadvisor else [])
       + ([monitoring_ports.ops_exporter] if monitoring_ops_group | length > 0 else [])
       + ([monitoring_ports.alert_dm] if monitoring_alert_dm else []) }}

# Que estén arrancados no basta: Prometheus tiene que poder leerlos a todos.
# Los de contenido van cada 15 min: tras recargar pueden seguir sin leer
# (unknown), pero caídos no.
- name: Todos los objetivos de Prometheus responden
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ monitoring_ports.prometheus }}/api/v1/targets?state=active
    return_content: true
  register: monitoring_targets
  until: >-
    monitoring_targets.json.data.activeTargets | length > 0
    and monitoring_targets.json.data.activeTargets
        | rejectattr('health', 'equalto', 'up')
        | rejectattr('scrapePool', 'equalto', 'contenido')
        | list | length == 0
    and monitoring_targets.json.data.activeTargets | selectattr('health', 'equalto', 'down') | list | length == 0
  retries: 12
  delay: 10
  changed_when: false
